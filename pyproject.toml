[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "geoluck"
version = "0.1.0"
description = "Research pipeline and static site scaffold for geography and prosperity analysis."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "geoluck contributors" }
]
dependencies = [
  "duckdb>=1.2.2",
  "geopandas>=1.0.1",
  "numpy>=2.2.4",
  "openpyxl>=3.1.5",
  "pandas>=2.2.3",
  "pypdf>=5.4.0",
  "pyogrio>=0.10.0",
  "pyarrow>=19.0.1",
  "pycountry>=26.2.16",
  "rasterio>=1.4.3",
  "scikit-learn>=1.6.1",
  "shap>=0.47.2",
  "typer>=0.15.2",
  "xlrd>=2.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.11.0",
]

[project.scripts]
geoluck = "geoluck.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/geoluck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
